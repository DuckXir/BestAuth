# ===== LOGIN TIME LIMIT =====
# Time limit for players to log in (seconds)
giris-suresi: 60

# ===== DEFAULT LANGUAGE =====
# Options: en (English), tr (Turkish), de (German), es (Spanish)
dil: en

# ===== IP LOGGING =====
ip-logla: true

# ===== MAX ACCOUNTS PER IP =====
# Maximum accounts allowed per single IP address
maks-hesap-sayisi: 1

# ===== DATABASE SETTINGS =====
# Options: yaml, sqlite, mysql
veritabani-tipi: yaml

mysql:
  host: "localhost"
  port: 3306
  veritabani: "bestauth"
  kullanici: "root"
  sifre: ""

# ===== PASSWORD RULES =====
sifre-min: 4
sifre-max: 32

# ===== BRUTE FORCE PROTECTION =====
maks-deneme: 3
hata-gecikme: 2

# ===== RATE LIMITING (IP BASED) =====
rate-limit-aktif: true
rate-limit-dakika: 5
rate-limit-maks: 10

# ===== VAULT ECONOMY INTEGRATION =====
# Rewards players with money upon their first registration
vault:
  odul-aktif: true
  odul-miktari: 100

# ===== SANDBOX MODE =====
# Disables password verification for testing servers (Default: false)
sandbox-modu: false

# ===== CHAT PASSWORD FILTER =====
# Replaces passwords with ***** if accidentally typed in chat
sifre-filtre: true

# ===== TAB COMPLETION BLOCK =====
# Blocks command completion for unauthenticated players
tab-engel: true

# ===== AUTO LOGIN BY IP =====
# Automatically logs in if IP matches (Not recommended: false)
ip-giris-aktif: false
ip-eslesme-oktet: 3

# ===== REMINDERS =====
# Periodically reminds unauthenticated players to log in
animsatma-aktif: true
animsatma-aralik: 30

# ===== PASSWORD BLACKLIST =====
# Disallows easily guessable passwords
sifre-kara-listesi:
  - "1234"
  - "12345"
  - "123456"
  - "sifre"
  - "password"
  - "qwerty"
  - "abc123"
  - "deneme"

# ===== CHAT MESSAGES =====
chat:
  join_enabled: true
  leave_enabled: true
