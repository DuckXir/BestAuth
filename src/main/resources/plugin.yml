name: BestAuth
version: 1.0.0
main: io.opencode.bestauth.Main
api-version: "1.21"
author: OpenCode
description: Modern, secure, and multi-language player authentication plugin

commands:
  login:
    description: Login to your account
    usage: /<command> <password>
    aliases: [giris]
  register:
    description: Register a new account
    usage: /<command> <password>
    aliases: [kayit]
  bestauth:
    description: Administrative management commands
    usage: /<command> <view|list> [player]
    aliases: [auth, authadmin]
    permission: bestauth.admin
  resetpassword:
    description: Reset a player's password
    usage: /<command> <player>
    aliases: [sifre-sifirla, sifresifirla]
    permission: bestauth.admin
  auth-reload:
    description: Reload configuration and language files
    usage: /<command>
    aliases: [kayit-reload]
    permission: bestauth.admin

permissions:
  bestauth.admin:
    description: Access to administrative commands
    default: op
  bestauth.muaf:
    description: Bypass authentication requirements
    default: false
